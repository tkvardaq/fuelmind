{{define "body"}}
<div class="auth">
  <h1>FuelMind</h1>
  <p class="muted">Enter your PIN to continue.</p>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="post" action="/login">
    <div>
      <label for="pin-input" class="sr-only">PIN</label>
      <input type="password" id="pin-input" name="pin" autofocus autocomplete="current-password" placeholder="PIN" required>
    </div>
    <button type="submit">Log in</button>
  </form>
  <p class="muted small">Forgot the PIN? On the shop PC, run <code>fuelmind-setup reset-pin</code> as administrator.</p>
</div>
{{end}}
{{template "base" .}}
