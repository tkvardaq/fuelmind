{{define "body"}}
<div class="auth">
  <h1>FuelMind</h1>
  <p class="muted">Enter your PIN to continue.</p>
  {{if .Error}}<div class="error">{{.Error}}</div>{{end}}
  <form method="post" action="/login">
    <div>
      <label for="pin-input" class="sr-only">PIN</label>
      <input type="password" id="pin-input" name="pin" autofocus autocomplete="off" placeholder="PIN">
    </div>
    <button type="submit">Log in</button>
  </form>
  <p class="muted small">First time? <a href="/setup">Set up a PIN</a>.</p>
</div>
{{end}}
{{template "base" .}}
