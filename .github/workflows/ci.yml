name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            gofmt -s -d .
            exit 1
          fi

      - name: Tidy check
        run: go mod tidy -diff

      - name: Test
        run: go test -race -count=1 ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m

  release-build:
    name: build windows binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile
        run: |
          mkdir -p dist
          for cmd in fuelmind-core:FuelMindCore fuelmind-launcher:fuelmind-launcher fuelmind-setup:fuelmind-setup; do
            src="${cmd%%:*}"; out="${cmd##*:}"
            GOOS=windows GOARCH=amd64 go build -trimpath \
              -ldflags "-s -w -X main.version=ci-${GITHUB_SHA::7}" \
              -o "dist/$out.exe" "./cmd/$src"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: fuelmind-windows-amd64
          path: dist/*.exe
